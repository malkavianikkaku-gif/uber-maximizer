<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - UberMaximizer</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #1a202c; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: #2d3748; text-align: center; border-bottom: 2px solid #3182ce; padding-bottom: 10px; }
        label { font-weight: 600; color: #4a5568; font-size: 14px; display: block; margin-top: 15px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; background-color: #3182ce; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 24px; transition: background 0.2s; }
        button:hover { background-color: #2b6cb0; }
        .error-msg { background-color: #fed7d7; color: #742a2a; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 15px; text-align: center; font-weight: 500; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #718096; }
        .footer-link a { color: #3182ce; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🚖 Ingresar a UberMaximizer</h2>
        
        {% if error %}
            <div class="error-msg">❌ Usuario o contraseña incorrectos. Intenta de nuevo.</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label>Nombre de Usuario:</label>
            <input type="text" name="username" placeholder="Tu usuario" required>
            
            <label>Contraseña:</label>
            <input type="password" name="password" placeholder="Tu contraseña" required>

            <button type="submit">Entrar al Tablero</button>
        </form>

        <div class="footer-link">
            ¿Eres nuevo? <a href="{% url 'registro' %}">Regístrate aquí</a>
        </div>
    </div>
</body>
</html>
